os:
  edit: "floaterm"
keybinding:
  universal:
    return: "<esc>"
gui:
  border: rounded
  nerdFontsVersion: '3'
  theme:
    activeBorderColor:
      - "#74c7ec"
      - bold
    inactiveBorderColor:
      - "#7b8496"
    searchingActiveBorderColor:
      - "#f38ba8"
    optionsTextColor:
      - "#ffffff"
    selectedLineBgColor:
      - "#3c4048"
    cherryPickedCommitBgColor:
      - "#3c4048"
    cherryPickedCommitFgColor:
      - "#cba6f7"
    unstagedChangesColor:
      - "#fab387"
    defaultFgColor:
      - "#ffffff"
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
